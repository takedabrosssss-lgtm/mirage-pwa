<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="MIRAGE — trading intelligence and futures paper trading">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/styles.css">
  <title>MIRAGE</title>
</head>
<body>
  <div id="login-screen" class="login-screen">
    <div class="login-brand">
      <svg class="logo-mark large" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 7 83 26 83 60 64 72 64 43 50 51 36 43 36 72 17 60 17 26 50 7Z"/><path d="M50 7 50 24 72 37M50 24 28 37M50 51 50 91"/></svg>
      <span>M I R A G E</span>
    </div>
    <div class="login-card">
      <p class="eyebrow">TRADING INTELLIGENCE</p>
      <h1 id="login-title">Добро пожаловать</h1>
      <p class="muted" id="login-subtitle">Войдите в свой аккаунт MIRAGE</p>
      <form id="login-form">
        <label for="login-user">Логин</label>
        <input id="login-user" name="username" autocomplete="username" required placeholder="Ваш логин">
        <label for="login-pass">Пароль</label>
        <input id="login-pass" name="password" type="password" autocomplete="current-password" required placeholder="Ваш пароль">
        <button class="btn primary full" type="submit" id="login-button">Войти <span>→</span></button>
        <div id="login-error" class="form-error" role="alert"></div>
      </form>
    </div>
    <div class="login-foot">PAPER TRADING · PRIVATE ACCESS</div>
  </div>

  <div id="app-shell" class="app-shell hidden">
    <header class="topbar">
      <div class="brand-lockup">
        <svg class="logo-mark" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 7 83 26 83 60 64 72 64 43 50 51 36 43 36 72 17 60 17 26 50 7Z"/><path d="M50 7 50 24 72 37M50 24 28 37M50 51 50 91"/></svg>
        <span>M I R A G E</span>
      </div>
      <div class="top-actions"><span class="paper-badge">PAPER</span><button class="icon-btn" id="profile-btn" aria-label="Profile"><span id="profile-initial">U</span></button></div>
    </header>

    <main id="page-content" class="page-content" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-item active" data-page="home"><span class="nav-icon">⌂</span><small data-i18n="home">Главная</small></button>
      <button class="nav-item" data-page="scanner"><span class="nav-icon">◎</span><small data-i18n="scanner">Сканер</small></button>
      <button class="nav-item" data-page="analytics"><span class="nav-icon">◴</span><small data-i18n="analytics">Аналитика</small></button>
      <button class="nav-item" data-page="trading"><span class="nav-icon">ϟ</span><small data-i18n="trading">Торговля</small></button>
      <button class="nav-item" data-page="more"><span class="nav-icon">•••</span><small data-i18n="more">Ещё</small></button>
    </nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script src="/static/app.js" defer></script>
</body>
</html>
