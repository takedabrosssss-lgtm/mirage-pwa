<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f3f5f8">
  <meta name="description" content="MIRAGE — private futures trading intelligence">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/styles.css?v=15">
  <title>MIRAGE</title>
</head>
<body>
  <div id="login-screen" class="login-screen">
    <div class="login-atmosphere"></div>
    <div class="login-brand">
      <svg class="logo-mark logo-large" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 7 83 26 83 60 64 72 64 43 50 51 36 43 36 72 17 60 17 26 50 7Z"/><path d="M50 7 50 24 72 37M50 24 28 37M50 51 50 91"/></svg>
      <span>M I R A G E</span>
    </div>
    <div class="login-card">
      <div class="eyebrow">PRIVATE FUTURES INTELLIGENCE</div>
      <h1 id="login-title">Добро пожаловать</h1>
      <p id="login-subtitle" class="muted">Войдите в свой аккаунт MIRAGE</p>
      <form id="login-form" autocomplete="on">
        <label for="login-user">Логин</label>
        <div class="login-input-wrap"><span class="field-icon" data-icon="user"></span><input id="login-user" name="username" autocomplete="username" required placeholder="Ваш логин"></div>
        <label for="login-pass">Пароль</label>
        <div class="login-input-wrap"><span class="field-icon" data-icon="lock"></span><input id="login-pass" name="password" type="password" autocomplete="current-password" required placeholder="Ваш пароль"></div>
        <button class="btn primary full" type="submit" id="login-button"><span>Войти в MIRAGE</span><span data-icon="arrow-right"></span></button>
        <div id="login-error" class="form-error" role="alert"></div>
      </form>
      <div class="login-security"><span class="live-dot"></span> PRIVATE ACCESS <span class="security-sep"></span> PAPER ONLY</div>
    </div>
    <div class="login-foot">MARKET INTELLIGENCE · RISK CONTROL · PAPER EXECUTION</div>
  </div>

  <div id="app-shell" class="app-shell hidden">
    <header class="topbar">
      <div class="brand-lockup">
        <svg class="logo-mark" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 7 83 26 83 60 64 72 64 43 50 51 36 43 36 72 17 60 17 26 50 7Z"/><path d="M50 7 50 24 72 37M50 24 28 37M50 51 50 91"/></svg>
        <div class="brand-wordmark"><span>MIRAGE</span><small>FUTURES INTELLIGENCE</small></div>
      </div>
      <div class="top-actions">
        <button id="mode-toggle" class="mode-switch" type="button" aria-label="Switch interface mode"><span class="mode-indicator"></span><span id="mode-label">STEALTH MODE</span><span class="mode-caret" data-icon="chevrons-up-down"></span></button>
        <div class="account-avatar-small" id="profile-initial" aria-label="Текущий аккаунт" title="Аккаунт">U</div>
      </div>
    </header>

    <main id="page-content" class="page-content" aria-live="polite">
      <div class="loading-screen"><span class="loader-orbit"></span><span>Инициализация MIRAGE</span></div>
    </main>

    <nav class="bottom-nav" aria-label="Главная навигация">
      <button class="nav-item active" data-page="home" type="button"><span class="nav-icon" data-icon="home"></span><small>Главная</small></button>
      <button class="nav-item" data-page="scanner" type="button"><span class="nav-icon" data-icon="scan-line"></span><small>Сканер</small></button>
      <button class="nav-item" data-page="analytics" type="button"><span class="nav-icon" data-icon="chart-no-axes-combined"></span><small>Аналитика</small></button>
      <button class="nav-item" data-page="trading" type="button"><span class="nav-icon" data-icon="arrow-left-right"></span><small>Торговля</small></button>
      <button class="nav-item" data-page="more" type="button"><span class="nav-icon" data-icon="layers-3"></span><small>Ещё</small></button>
    </nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div id="mode-transition" class="mode-transition-overlay" aria-hidden="true">
    <div class="mode-transition-haze"></div>
    <div class="mode-transition-stage">
      <span class="mode-orbit orbit-a"></span><span class="mode-orbit orbit-b"></span><span class="mode-orbit orbit-c"></span>
      <span class="mode-shard shard-a"></span><span class="mode-shard shard-b"></span><span class="mode-shard shard-c"></span><span class="mode-shard shard-d"></span>
      <div class="mode-emblem">
        <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 7 83 26 83 60 64 72 64 43 50 51 36 43 36 72 17 60 17 26 50 7Z"/><path d="M50 7 50 24 72 37M50 24 28 37M50 51 50 91"/></svg>
      </div>
      <div class="mode-transition-name" id="mode-transition-name">STEALTH MODE</div>
      <div class="mode-transition-caption">MIRAGE · INTERFACE SHIFT</div>
    </div>
  </div>
  <div id="onboarding-screen" class="onboarding-screen hidden">
    <div class="onboarding-card">
      <div class="onboarding-brand"><svg class="logo-mark" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 7 83 26 83 60 64 72 64 43 50 51 36 43 36 72 17 60 17 26 50 7Z"/><path d="M50 7 50 24 72 37M50 24 28 37M50 51 50 91"/></svg><span>MIRAGE</span></div>
      <div id="onboarding-art" class="onboarding-art" data-art="market"><i></i><b></b><em></em></div>
      <div id="onboarding-copy" class="onboarding-copy"></div>
      <div class="onboarding-footer"><div id="onboarding-dots" class="onboarding-dots"></div><div><button id="onboarding-skip" class="onboarding-skip" type="button">Пропустить</button><button id="onboarding-next" class="btn primary" type="button">Далее</button></div></div>
    </div>
  </div>
  <script src="/static/app.js?v=15" defer></script>
</body>
</html>
